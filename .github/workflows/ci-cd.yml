name: CI for social project only

on:
  push:
    paths:
      - 'scaffolding-api-server/social/**'      # Trigger only if files in this folder change
  pull_request:
    paths:
      - 'scaffolding-api-server/social/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache-dependency-path: scaffolding-api-server/social/go.sum
    
    - name: Install dependencies
      run: go get .
    
    - name: Test with Go
      run: go test -json > TestResults-${{ matrix.go-version }}.json
      working-directory: scaffolding-api-server/social
    
    - name: Build
      run: go build -v ./...
      working-directory: scaffolding-api-server/social

    - name: Test with Go
      run: go test 

  
