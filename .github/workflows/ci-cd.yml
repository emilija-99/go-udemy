name: CI for social project only

on:
  push:
    paths:
      - 'scaffolding-api-server/social/**'      # Trigger only if files in this folder change
  pull_request:
    paths:
      - 'scaffolding-api-server/social/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v ./...
      working-directory: scaffolding-api-server/social

    - name: Test
      run: go test -v ./...
      working-directory: scaffolding-api-server/social
